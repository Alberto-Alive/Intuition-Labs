# DIGRAG experiment configuration.
# All five systems share the SAME decoder LLM and the SAME embedding model so
# that any difference in final-answer quality is attributable to the
# retrieval/evidence-compilation stage, not to a stronger generator.

seed: 0

dataset:
  n_scenarios: 220          # themed document families
  distractor_docs: 400      # global background docs (raise grep false-positive rate)
  out_dir: data

models:
  # Shared decoder used by every system. Swap for Qwen2.5-0.5B-Instruct (faster,
  # weaker) or Qwen2.5-3B-Instruct (slower, stronger) to test generator scaling.
  decoder: Qwen/Qwen2.5-1.5B-Instruct
  embedder: sentence-transformers/all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cuda
  dtype: float16
  # Offline mode swaps in a deterministic extractive decoder + hashing embedder
  # so the pipeline always runs with zero downloads (used for CI / smoke tests).
  offline: false

retrieval:
  top_k: 5                  # spans/chunks passed to the decoder
  recall_k: [1, 3, 5, 10]   # k values reported for recall@k
  chunk_size: 240           # chars per chunk for dense/hybrid
  chunk_overlap: 40
  hybrid_alpha: 0.5         # dense vs lexical fusion weight (RRF used by default)
  rrf_k: 60

generation:
  max_new_tokens: 200
  batch_size: 24            # prompts decoded together on the GPU (the "parallel")
  temperature: 0.0          # greedy for reproducibility

cost:
  # Local inference is effectively free; we still report a $ figure using a
  # configurable rate so the metric is comparable to hosted-API setups.
  usd_per_1k_input_tokens: 0.0
  usd_per_1k_output_tokens: 0.0
  # For an apples-to-apples hosted comparison, set e.g. 0.00015 / 0.0006.
