variant: scout_best_custom
seed: 0
seeds:
- 0
notes:
  custom_rationale: 'The follow-up starts from shared crossing and reacts to the expected
    ignored-crossing/full-versus-single failure mode: crossings run every two layers
    with a larger initial gamma, light avenue dropout, leave-one training, and a small
    diversity penalty so a full four-avenue read has reason to keep private trajectories
    useful.

    '
model:
  variant: scout_best_custom
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_ff: 512
  dropout: 0.1
  max_seq_len: 256
  num_avenues: 4
  avenue_dim: 128
  align_stride: 8
  d_cross: 64
  gamma_init: 0.2
  crossing_kind: shared
  crossing_interval: 2
  crossing_layernorm: true
  avenue_dropout: 0.1
  leave_one_prob: 0.25
data:
  seq_len_train: 128
  seq_len_eval:
  - 128
  - 256
  batch_size: 32
  eval_batch_size: 24
  eval_examples: 128
  control_examples: 96
  train_distractor_range:
  - 4
  - 14
  train_overwrite_range:
  - 1
  - 4
  eval_distractor_range:
  - 6
  - 18
  eval_overwrite_range:
  - 2
  - 5
  eval_profiles:
    in_distribution:
      seq_len: 128
      distractor_range:
      - 6
      - 16
      overwrite_range:
      - 2
      - 5
      examples: 128
    high_distractor:
      seq_len: 128
      distractor_range:
      - 18
      - 30
      overwrite_range:
      - 1
      - 4
      examples: 128
    many_overwrite:
      seq_len: 128
      distractor_range:
      - 6
      - 18
      overwrite_range:
      - 5
      - 8
      examples: 128
loss:
  lambda_align: 0.0
  lambda_div: 0.001
  lambda_orth: 0.0
training:
  device: cuda
  amp: true
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  max_steps: 2500
  eval_every: 250
  log_every: 50
  grad_clip: 1.0
